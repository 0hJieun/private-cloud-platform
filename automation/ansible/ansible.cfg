[defaults]
# 오래 유지되는 outer 인프라와 worker가 생성하는 inner VM runtime inventory를 함께 쓴다.
inventory = inventory/hosts.yml,inventory/instances.py
roles_path = roles
interpreter_python = auto_silent
host_key_checking = True
retry_files_enabled = False
remote_user = user1
private_key_file = ~/.ssh/private-cloud-ansible

[privilege_escalation]
become = True
