all:
  children:
    control_nodes:
      hosts:
        control:
          ansible_connection: local
          monitoring_bind_address: 172.16.2.10
          monitoring_role: control
          dhcp_interface: ens192
          dhcp_provider_zone: pc-provider
          dhcp_subnet: 172.16.8.0
          dhcp_netmask: 255.255.255.0
          dhcp_pool_start: 172.16.8.151
          dhcp_pool_end: 172.16.8.239
          dhcp_gateway: 172.16.8.2
          dhcp_dns_servers: 8.8.8.8, 1.1.1.1

    # 복제 직후에는 모든 노드가 172.16.2.100으로 시작한다.
    # target_* 값은 실행 시 extra vars로 한 대씩 전달한다.
    bootstrap_nodes:
      hosts:
        new_node_bootstrap:
          ansible_host: 172.16.2.100
          bootstrap_management_interface: ens160

    # 초기화가 끝난 노드는 역할별 고정 관리 주소로 관리한다.
    compute_nodes:
      hosts:
        compute1:
          ansible_host: 172.16.2.11
          node_role: compute
          monitoring_bind_address: 172.16.2.11
          monitoring_role: compute
          # 3 vCPU/6GB outer VM에서 host OS와 libvirt를 위해 남겨 둔 여유분을 제외한
          # scheduler의 보수적 배치 한도다. 실제 사용량은 scheduler가 virsh로 다시 확인한다.
          scheduler_allocatable_vcpus: 2
          scheduler_allocatable_memory_mb: 4096
          provider_interface: ens192
          provider_address: 172.16.8.11/24
          provider_gateway: 172.16.8.2
          provider_dns: 8.8.8.8,1.1.1.1

        compute2:
          ansible_host: 172.16.2.12
          node_role: compute
          monitoring_bind_address: 172.16.2.12
          monitoring_role: compute
          scheduler_allocatable_vcpus: 2
          scheduler_allocatable_memory_mb: 4096
          provider_interface: ens192
          provider_address: 172.16.8.12/24
          provider_gateway: 172.16.8.2
          provider_dns: 8.8.8.8,1.1.1.1

    storage_nodes:
      hosts:
        storage1:
          ansible_host: 172.16.2.21
          node_role: storage
          monitoring_bind_address: 172.16.2.21
          monitoring_role: storage
          storage_data_device: /dev/sdb
          provider_interface: ens192
          provider_address: 172.16.8.21/24
          provider_gateway: 172.16.8.2
          provider_dns: 8.8.8.8,1.1.1.1

        storage2:
          ansible_host: 172.16.2.22
          node_role: storage
          monitoring_bind_address: 172.16.2.22
          monitoring_role: storage
          storage_data_device: /dev/sdb
          provider_interface: ens192
          provider_address: 172.16.8.22/24
          provider_gateway: 172.16.8.2
          provider_dns: 8.8.8.8,1.1.1.1

    monitoring_nodes:
      children:
        control_nodes:
        compute_nodes:
        storage_nodes:
