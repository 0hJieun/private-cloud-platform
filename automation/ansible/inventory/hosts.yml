all:
  children:
    control_nodes:
      hosts:
        control:
          ansible_connection: local

    # 복제 직후에는 모든 노드가 172.16.2.100으로 시작한다.
    # 역할별 IP로 변경하기 전, 한 대씩만 이 그룹을 사용한다.
    bootstrap_nodes:
      hosts:
        compute2_bootstrap:
          ansible_host: 172.16.2.100
          target_hostname: compute2
          target_management_address: 172.16.2.12/24
          bootstrap_management_interface: ens160

    # 초기화가 끝난 노드는 역할별 고정 관리 주소로 관리한다.
    compute_nodes:
      hosts:
        compute1:
          ansible_host: 172.16.2.11
          node_role: compute
          provider_interface: ens192
          provider_address: 172.16.8.11/24
          provider_gateway: 172.16.8.2
          provider_dns: 8.8.8.8,1.1.1.1

        compute2:
          ansible_host: 172.16.2.12
          node_role: compute
          provider_interface: ens192
          provider_address: 172.16.8.12/24
          provider_gateway: 172.16.8.2
          provider_dns: 8.8.8.8,1.1.1.1
