all:
  children:
    control_nodes:
      hosts:
        control:
          ansible_connection: local

    # 복제 직후에는 모든 노드가 172.16.2.100으로 시작한다.
    # 역할별 IP로 변경하기 전, 한 대씩만 이 그룹을 사용한다.
    bootstrap_nodes:
      hosts:
        compute1_bootstrap:
          ansible_host: 172.16.2.100
          target_hostname: compute1
          target_management_address: 172.16.2.11/24
          bootstrap_management_interface: ens160

    # 초기화가 끝난 노드는 역할별 고정 관리 주소로 관리한다.
    compute_nodes:
      hosts:
        compute1:
          ansible_host: 172.16.2.11
          node_role: compute
