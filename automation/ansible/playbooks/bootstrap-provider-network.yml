---
- name: compute 노드의 외부 패키지 저장소 연결 준비
  hosts: compute_nodes
  gather_facts: false
  become: true

  tasks:
    - name: provider NIC의 NetworkManager 연결 프로필 확인
      ansible.builtin.command:
        argv:
          - nmcli
          - --get-values
          - GENERAL.CONNECTION
          - device
          - show
          - "{{ provider_interface }}"
      register: provider_connection
      changed_when: false
      check_mode: false

    - name: provider NIC 연결 프로필이 존재하는지 확인
      ansible.builtin.assert:
        that:
          - provider_connection.stdout | trim | length > 0
          - provider_connection.stdout | trim != '--'
        fail_msg: >-
          {{ provider_interface }}에서 NetworkManager 연결 프로필을 찾지 못했습니다.

    # OVS 설치 전에는 물리 NIC에 주소를 잠시 둔다.
    # 이후 br-provider 생성 시 이 동일한 주소를 브리지로 이전한다.
    - name: provider NIC에 임시 외부 주소와 DNS 설정
      ansible.builtin.command:
        argv:
          - nmcli
          - connection
          - modify
          - "{{ provider_connection.stdout | trim }}"
          - ipv4.method
          - manual
          - ipv4.addresses
          - "{{ provider_address }}"
          - ipv4.gateway
          - "{{ provider_gateway }}"
          - ipv4.dns
          - "{{ provider_dns }}"
          - ipv4.never-default
          - 'no'
          - ipv6.method
          - disabled
          - connection.autoconnect
          - 'yes'
      changed_when: true
      when: not ansible_check_mode

    - name: provider NIC 연결 활성화
      ansible.builtin.command:
        argv:
          - nmcli
          - connection
          - up
          - "{{ provider_connection.stdout | trim }}"
      changed_when: true
      when: not ansible_check_mode

    - name: Rocky 저장소 도메인 DNS 해석 확인
      ansible.builtin.command:
        argv:
          - getent
          - ahostsv4
          - mirrors.rockylinux.org
      changed_when: false
      when: not ansible_check_mode
