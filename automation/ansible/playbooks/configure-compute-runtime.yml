---
- name: compute 노드 가상화 런타임 준비
  hosts: compute_nodes
  gather_facts: false
  become: true

  vars:
    # Rocky Linux 기본 저장소에는 Open vSwitch 패키지가 없다.
    # CentOS NFV SIG의 EL9 OVS 저장소는 이 로컬 실습에서만 사용하는 호환 저장소다.
    centos_extras_sig_key_url: https://www.centos.org/keys/RPM-GPG-KEY-CentOS-SIG-Extras
    nfv_sig_key_url: https://www.centos.org/keys/RPM-GPG-KEY-CentOS-SIG-NFV
    nfv_sig_common_release_rpm_url: https://mirror.stream.centos.org/SIGs/9-stream/extras/x86_64/extras-common/Packages/c/centos-release-nfv-common-1-5.el9s.noarch.rpm
    nfv_sig_release_rpm_url: https://mirror.stream.centos.org/SIGs/9-stream/extras/x86_64/extras-common/Packages/c/centos-release-nfv-openvswitch-1-5.el9s.noarch.rpm
    ovs_package_name: openvswitch3.5

  tasks:
    # release RPM은 Extras SIG 키로, 설치 후 OVS 패키지는 NFV SIG 키로 검증한다.
    - name: CentOS SIG 저장소 서명키 등록
      ansible.builtin.rpm_key:
        state: present
        key: "{{ item }}"
      loop:
        - "{{ centos_extras_sig_key_url }}"
        - "{{ nfv_sig_key_url }}"

    - name: Open vSwitch용 NFV SIG 저장소 등록
      ansible.builtin.dnf:
        name:
          - "{{ nfv_sig_common_release_rpm_url }}"
          - "{{ nfv_sig_release_rpm_url }}"
        state: present

    - name: compute 가상화와 OVS 패키지 설치
      ansible.builtin.dnf:
        name:
          - qemu-kvm
          - libvirt
          - libvirt-client
          - libvirt-daemon-kvm
          - virt-install
          - NetworkManager-ovs
          - "{{ ovs_package_name }}"
          - openvswitch-selinux-extra-policy
        state: present
      notify: NetworkManager 다시 시작

    - name: libvirt 데몬 시작과 자동 시작 설정
      ansible.builtin.service:
        name: libvirtd
        state: started
        enabled: true

    - name: Open vSwitch 데몬 시작과 자동 시작 설정
      ansible.builtin.service:
        name: openvswitch
        state: started
        enabled: true

    # 인스턴스 디스크는 GlusterFS FUSE 마운트에 저장한다. 이 boolean이 없으면
    # SELinux가 qemu 프로세스의 FUSE 파일 접근을 막아 VM 부팅이 실패할 수 있다.
    - name: QEMU의 GlusterFS FUSE 접근 SELinux 정책 상태 확인
      ansible.builtin.command:
        argv:
          - getsebool
          - virt_use_fusefs
      register: virt_use_fusefs_state
      changed_when: false

    - name: QEMU의 GlusterFS FUSE 볼륨 접근 허용
      ansible.builtin.command:
        argv:
          - setsebool
          - -P
          - virt_use_fusefs
          - 'on'
      when: "'off' in virt_use_fusefs_state.stdout"

    - name: KVM 장치 확인
      ansible.builtin.command:
        argv:
          - test
          - -c
          - /dev/kvm
      changed_when: false
      check_mode: false

    - name: libvirt 시스템 연결 확인
      ansible.builtin.command:
        argv:
          - virsh
          - -c
          - qemu:///system
          - uri
      changed_when: false
      check_mode: false

    - name: Open vSwitch 설치 버전 확인
      ansible.builtin.command:
        argv:
          - ovs-vsctl
          - --version
      changed_when: false
      check_mode: false

  handlers:
    # NetworkManager는 시작할 때 OVS 플러그인을 불러온다.
    - name: NetworkManager 다시 시작
      ansible.builtin.service:
        name: NetworkManager
        state: restarted
