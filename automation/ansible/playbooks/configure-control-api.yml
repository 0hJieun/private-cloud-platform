---
- name: control 노드의 MariaDB와 private-cloud API 준비
  hosts: control_nodes
  gather_facts: false
  become: true

  vars:
    # Git 작업본은 user1 홈에 유지한다. systemd는 SELinux가 서비스 실행에 허용하는
    # /opt 릴리스 사본만 실행한다. 홈 디렉터리 권한을 완화하지 않기 위한 분리다.
    control_source_repository_root: /home/user1/private-cloud-platform
    control_release_root: /opt/private-cloud/release
    control_source_api_directory: "{{ control_source_repository_root }}/control-plane/api"
    control_api_directory: "{{ control_release_root }}/control-plane/api"
    control_api_venv: "{{ control_api_directory }}/.venv"
    control_api_environment_directory: /etc/private-cloud
    control_api_environment_file: "{{ control_api_environment_directory }}/api.env"
    control_api_bootstrap_marker: "{{ control_api_environment_directory }}/bootstrap.complete"
    control_api_initial_credentials_file: /home/user1/private-cloud-initial-credentials.env
    control_api_work_directory: /home/user1/.local/share/private-cloud/operations
    # tenant VM에 주입하는 키는 compute/storage 등 outer 노드용 Ansible 키와 분리한다.
    control_instance_automation_private_key: /home/user1/.ssh/private-cloud-instance-automation
    control_instance_automation_public_key: /home/user1/.ssh/private-cloud-instance-automation.pub
    control_instance_inventory_directory: /home/user1/.local/share/private-cloud/ansible
    control_instance_inventory_file: /home/user1/.local/share/private-cloud/ansible/instances.json
    control_instance_known_hosts_file: /home/user1/.local/share/private-cloud/ansible/known_hosts
    control_api_database_name: private_cloud
    control_api_database_user: privatecloud
    control_api_service_name: private-cloud-api
    control_worker_service_name: private-cloud-worker
    control_portal_listen_address: 172.16.2.10
    control_portal_port: 8080

  tasks:
    - name: API 소스 코드 존재 여부 확인
      ansible.builtin.stat:
        path: "{{ control_source_api_directory }}/app/main.py"
      register: control_api_source

    - name: API 소스 코드 검증
      ansible.builtin.assert:
        that:
          - control_api_source.stat.exists
          - control_api_source.stat.isreg
        fail_msg: control 저장소를 최신 main 브랜치로 동기화한 뒤 실행하세요.

    - name: user1 SSH 키 디렉터리 권한 확인
      ansible.builtin.file:
        path: /home/user1/.ssh
        state: directory
        owner: user1
        group: user1
        mode: '0700'

    - name: inner VM 전용 Ansible automation 키 생성
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -q
          - -t
          - ed25519
          - -N
          - ''
          - -f
          - "{{ control_instance_automation_private_key }}"
          - -C
          - private-cloud-instance-automation
      args:
        creates: "{{ control_instance_automation_private_key }}"
      become_user: user1

    - name: inner VM automation private key 권한 제한
      ansible.builtin.file:
        path: "{{ control_instance_automation_private_key }}"
        owner: user1
        group: user1
        mode: '0600'

    - name: inner VM automation public key 권한 설정
      ansible.builtin.file:
        path: "{{ control_instance_automation_public_key }}"
        owner: user1
        group: user1
        mode: '0644'

    - name: MariaDB Python과 portal proxy 패키지 설치
      ansible.builtin.dnf:
        name:
          - mariadb-server
          - python3-pip
          - nginx
          - rsync
        state: present

    - name: systemd용 private-cloud 릴리스 경로 생성
      ansible.builtin.file:
        path: "{{ control_release_root }}"
        state: directory
        owner: user1
        group: user1
        mode: '0755'

    # .git과 로컬 virtualenv는 실행 릴리스에 포함하지 않는다. 매 배포마다 Git 작업본의
    # 코드·Ansible·static asset을 같은 release 경로로 동기화해 API와 worker의 버전을 맞춘다.
    - name: Git 작업본을 systemd 실행 릴리스로 동기화
      ansible.builtin.command:
        argv:
          - rsync
          - -a
          - --delete
          - --itemize-changes
          - --exclude=.git
          - --exclude=.venv
          - "{{ control_source_repository_root }}/"
          - "{{ control_release_root }}/"
      register: control_release_sync
      changed_when: control_release_sync.stdout | trim | length > 0

    - name: MariaDB 시작과 자동 시작 설정
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: true

    - name: firewalld 시작 상태 확인
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: API 환경 변수 디렉터리 생성
      ansible.builtin.file:
        path: "{{ control_api_environment_directory }}"
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: 기존 API database secret 확인
      ansible.builtin.stat:
        path: "{{ control_api_environment_file }}"
      register: control_api_environment

    - name: MariaDB application password 생성
      ansible.builtin.command:
        argv:
          - openssl
          - rand
          - -hex
          - '24'
      register: control_api_database_password
      changed_when: true
      no_log: true
      when: not control_api_environment.stat.exists

    - name: API session secret 생성
      ansible.builtin.command:
        argv:
          - openssl
          - rand
          - -hex
          - '32'
      register: control_api_session_secret
      changed_when: true
      no_log: true
      when: not control_api_environment.stat.exists

    - name: 기존 monitoring discovery token 확인
      ansible.builtin.command:
        argv:
          - grep
          - -q
          - '^PRIVATE_CLOUD_MONITORING_DISCOVERY_TOKEN='
          - "{{ control_api_environment_file }}"
      register: control_api_monitoring_token_present
      changed_when: false
      failed_when: false
      no_log: true
      when: control_api_environment.stat.exists

    - name: Prometheus service discovery token 생성
      ansible.builtin.command:
        argv:
          - openssl
          - rand
          - -hex
          - '32'
      register: control_api_monitoring_discovery_token
      changed_when: true
      no_log: true
      when: >-
        not control_api_environment.stat.exists or
        control_api_monitoring_token_present.rc | default(1) != 0

    # hex 값만 사용하므로 DB URL 및 SQL 문자열에 안전하게 넣을 수 있다.
    - name: API 전용 database secret 파일 생성
      ansible.builtin.copy:
        dest: "{{ control_api_environment_file }}"
        owner: root
        group: root
        mode: '0600'
        content: |
          PRIVATE_CLOUD_ENVIRONMENT=lab
          PRIVATE_CLOUD_DB_PASSWORD={{ control_api_database_password.stdout }}
          PRIVATE_CLOUD_DATABASE_URL=mysql+pymysql://{{ control_api_database_user }}:{{ control_api_database_password.stdout }}@127.0.0.1:3306/{{ control_api_database_name }}?charset=utf8mb4
          PRIVATE_CLOUD_SESSION_SECRET={{ control_api_session_secret.stdout }}
          PRIVATE_CLOUD_PROMETHEUS_URL=http://127.0.0.1:9090
          PRIVATE_CLOUD_MONITORING_DISCOVERY_TOKEN={{ control_api_monitoring_discovery_token.stdout }}
          PRIVATE_CLOUD_WORKER_INTERVAL_SECONDS=5
      no_log: true
      when: not control_api_environment.stat.exists

    - name: 기존 API 환경에 Prometheus loopback URL 추가
      ansible.builtin.lineinfile:
        path: "{{ control_api_environment_file }}"
        regexp: '^PRIVATE_CLOUD_PROMETHEUS_URL='
        line: 'PRIVATE_CLOUD_PROMETHEUS_URL=http://127.0.0.1:9090'
        owner: root
        group: root
        mode: '0600'
      when: control_api_environment.stat.exists

    - name: 기존 API 환경에 monitoring discovery token 추가
      ansible.builtin.lineinfile:
        path: "{{ control_api_environment_file }}"
        regexp: '^PRIVATE_CLOUD_MONITORING_DISCOVERY_TOKEN='
        line: 'PRIVATE_CLOUD_MONITORING_DISCOVERY_TOKEN={{ control_api_monitoring_discovery_token.stdout }}'
        owner: root
        group: root
        mode: '0600'
      no_log: true
      when:
        - control_api_environment.stat.exists
        - control_api_monitoring_token_present.rc | default(1) != 0

    # root은 MariaDB unix socket 인증으로만 사용한다. 앱은 아래 전용 DB 계정으로 접속한다.
    - name: API 전용 database와 최소 권한 사용자 구성
      ansible.builtin.shell: |
        set -euo pipefail
        source "{{ control_api_environment_file }}"
        mariadb --protocol=socket --user=root <<SQL
        CREATE DATABASE IF NOT EXISTS {{ control_api_database_name }} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        CREATE USER IF NOT EXISTS '{{ control_api_database_user }}'@'127.0.0.1' IDENTIFIED BY '${PRIVATE_CLOUD_DB_PASSWORD}';
        ALTER USER '{{ control_api_database_user }}'@'127.0.0.1' IDENTIFIED BY '${PRIVATE_CLOUD_DB_PASSWORD}';
        GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, INDEX, DROP ON {{ control_api_database_name }}.* TO '{{ control_api_database_user }}'@'127.0.0.1';
        FLUSH PRIVILEGES;
        SQL
      args:
        executable: /bin/bash
      no_log: true

    - name: API Python virtual environment 생성
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - venv
          - "{{ control_api_venv }}"
        creates: "{{ control_api_venv }}/bin/python"
      become_user: user1

    - name: API Python 의존성 설치
      ansible.builtin.pip:
        requirements: "{{ control_api_directory }}/requirements.txt"
        executable: "{{ control_api_venv }}/bin/pip"
      become_user: user1

    # API process는 metadata.create_all을 하지 않는다. 이 migration이 DB의 유일한
    # schema 변경 이력이다. 이후 컬럼 변경도 새 revision으로만 추가한다.
    - name: Alembic으로 control API database schema 적용
      ansible.builtin.shell: |
        set -euo pipefail
        # EnvironmentFile의 KEY=value는 source만으로 child process에 전달되지 않는다.
        # allexport를 켜서 Alembic/Python이 MariaDB URL을 os.environ에서 읽게 한다.
        set -a
        source "{{ control_api_environment_file }}"
        set +a
        "{{ control_api_venv }}/bin/alembic" -c "{{ control_api_directory }}/alembic.ini" upgrade head
      args:
        chdir: "{{ control_api_directory }}"
        executable: /bin/bash

    - name: 초기 catalog와 계정 bootstrap 완료 여부 확인
      ansible.builtin.stat:
        path: "{{ control_api_bootstrap_marker }}"
      register: control_api_bootstrap_marker

    - name: MariaDB 초기 계정 상태 확인
      ansible.builtin.command:
        argv:
          - mariadb
          - --protocol=socket
          - --user=root
          - --database={{ control_api_database_name }}
          - --skip-column-names
          - --batch
          - --execute=SELECT COUNT(*) FROM users WHERE username IN ('admin', 'member1');
      register: control_api_bootstrap_user_count
      changed_when: false

    - name: 초기 계정 credential 파일 존재 여부 확인
      ansible.builtin.stat:
        path: "{{ control_api_initial_credentials_file }}"
      register: control_api_initial_credentials
      when: control_api_bootstrap_user_count.stdout | trim | int < 2

    - name: 관리자 초기 비밀번호 생성
      ansible.builtin.command:
        argv:
          - openssl
          - rand
          - -hex
          - '16'
      register: control_api_admin_password
      changed_when: true
      no_log: true
      when:
        - control_api_bootstrap_user_count.stdout | trim | int < 2
        - not control_api_initial_credentials.stat.exists

    - name: member1 초기 비밀번호 생성
      ansible.builtin.command:
        argv:
          - openssl
          - rand
          - -hex
          - '16'
      register: control_api_member_password
      changed_when: true
      no_log: true
      when:
        - control_api_bootstrap_user_count.stdout | trim | int < 2
        - not control_api_initial_credentials.stat.exists

    # 이 파일은 control의 user1만 읽을 수 있다. Git·Ansible stdout·systemd 환경에는
    # 평문 계정을 남기지 않는다. 최초 로그인 직후 웹에서 바꾸는 단계는 다음 UI에 둔다.
    - name: 초기 admin과 member1 credential 파일 생성
      ansible.builtin.copy:
        dest: "{{ control_api_initial_credentials_file }}"
        owner: user1
        group: user1
        mode: '0600'
        content: |
          # 첫 로그인 후 안전한 곳에 보관하고 이 파일은 삭제하세요.
          PRIVATE_CLOUD_BOOTSTRAP_ADMIN_PASSWORD={{ control_api_admin_password.stdout }}
          PRIVATE_CLOUD_BOOTSTRAP_MEMBER_PASSWORD={{ control_api_member_password.stdout }}
      no_log: true
      when:
        - control_api_bootstrap_user_count.stdout | trim | int < 2
        - not control_api_initial_credentials.stat.exists

    - name: 초기 catalog와 admin member1 계정 생성
      ansible.builtin.shell: |
        set -euo pipefail
        # API DB URL·session secret·bootstrap password 모두 Python child process에 전달한다.
        set -a
        source "{{ control_api_environment_file }}"
        source "{{ control_api_initial_credentials_file }}"
        set +a
        "{{ control_api_venv }}/bin/python" -m app.bootstrap
      args:
        chdir: "{{ control_api_directory }}"
        executable: /bin/bash
      # password는 root/user1 전용 파일을 source할 뿐 명령 인자·stdout으로 출력하지
      # 않는다. 이 task의 traceback은 남겨야 bootstrap 실패 원인을 진단할 수 있다.
      # marker는 보조 기록일 뿐이다. 실제 MariaDB의 초기 계정 상태로 재실행 여부를
      # 결정해 이전 배포 중단으로 marker만 남은 경우도 자동 복구한다.
      when: control_api_bootstrap_user_count.stdout | trim | int < 2

    - name: 초기 catalog bootstrap 완료 marker 생성
      ansible.builtin.file:
        path: "{{ control_api_bootstrap_marker }}"
        state: touch
        owner: root
        group: root
        mode: '0600'
      when: not control_api_bootstrap_marker.stat.exists

    - name: worker의 공개키 임시 작업 경로 생성
      ansible.builtin.file:
        path: "{{ control_api_work_directory }}"
        state: directory
        owner: user1
        group: user1
        mode: '0700'

    - name: inner VM runtime inventory 경로 생성
      ansible.builtin.file:
        path: "{{ control_instance_inventory_directory }}"
        state: directory
        owner: user1
        group: user1
        mode: '0700'

    - name: 빈 inner VM runtime inventory 초기화
      ansible.builtin.copy:
        dest: "{{ control_instance_inventory_file }}"
        owner: user1
        group: user1
        mode: '0600'
        force: false
        content: |
          {"instances": {"hosts": []}, "_meta": {"hostvars": {}}}

    - name: inner VM SSH known hosts 파일 생성
      ansible.builtin.file:
        path: "{{ control_instance_known_hosts_file }}"
        state: touch
        owner: user1
        group: user1
        mode: '0600'
        access_time: preserve
        modification_time: preserve

    - name: private-cloud API systemd 서비스 등록
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ control_api_service_name }}.service"
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Private Cloud Control API
          After=network-online.target mariadb.service
          Wants=network-online.target
          Requires=mariadb.service

          [Service]
          Type=simple
          User=user1
          Group=user1
          WorkingDirectory={{ control_api_directory }}
          EnvironmentFile={{ control_api_environment_file }}
          ExecStart={{ control_api_venv }}/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=multi-user.target

    - name: private-cloud worker systemd 서비스 등록
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ control_worker_service_name }}.service"
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Private Cloud Operation Worker
          After=network-online.target mariadb.service {{ control_api_service_name }}.service
          Wants=network-online.target
          Requires=mariadb.service

          [Service]
          Type=simple
          User=user1
          Group=user1
          WorkingDirectory={{ control_release_root }}
          EnvironmentFile={{ control_api_environment_file }}
          ExecStart={{ control_api_venv }}/bin/python {{ control_release_root }}/control-plane/worker/worker.py
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=multi-user.target

    # 새 unit 파일을 처음 등록한 경우에도 아래 service task가 이름을 인식하도록 즉시 반영한다.
    - name: 새 systemd unit 다시 불러오기
      ansible.builtin.systemd:
        daemon_reload: true

    # 저장소에서 새 API 코드를 pull한 뒤 실행하는 deploy playbook이므로 매번 재시작한다.
    # 그래야 Python source 변경도 새 systemd process에 반영된다.
    - name: private-cloud API 재시작과 자동 시작 설정
      ansible.builtin.service:
        name: "{{ control_api_service_name }}"
        state: restarted
        enabled: true

    - name: private-cloud worker 재시작과 자동 시작 설정
      ansible.builtin.service:
        name: "{{ control_worker_service_name }}"
        state: restarted
        enabled: true

    # Portal은 API와 같은 origin으로 reverse proxy한다. 지금은 내부 lab HTTP만 쓰고,
    # 외부 공개 단계에서 TLS termination과 https_only cookie를 별도 적용한다.
    - name: private-cloud portal Nginx reverse proxy 설정
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/private-cloud.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          server {
              listen {{ control_portal_listen_address }}:{{ control_portal_port }};
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }

    - name: Nginx 설정 검증
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false

    # nginx(httpd_t)가 loopback upstream에 연결하려면 SELinux의 명시적인 network
    # connect 권한이 필요하다. 이 값이 off이면 Nginx는 502를 반환한다.
    - name: Nginx reverse proxy SELinux 권한 상태 확인
      ansible.builtin.command:
        argv:
          - getsebool
          - httpd_can_network_connect
      register: control_nginx_proxy_selinux
      changed_when: false

    - name: Nginx의 API upstream 연결 SELinux 권한 적용
      ansible.builtin.command:
        argv:
          - setsebool
          - -P
          - httpd_can_network_connect
          - 'on'
      when: control_nginx_proxy_selinux.stdout is not search('on$')

    - name: Nginx 시작과 portal 설정 반영
      ansible.builtin.service:
        name: nginx
        state: restarted
        enabled: true

    - name: firewalld에서 portal port 영구 허용 여부 확인
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --query-port={{ control_portal_port }}/tcp
      register: control_portal_firewall_port
      changed_when: false
      failed_when: false

    - name: firewalld에서 portal management port 허용
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --add-port={{ control_portal_port }}/tcp
      when: control_portal_firewall_port.rc != 0

    - name: portal port runtime 적용
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --add-port={{ control_portal_port }}/tcp
      when: control_portal_firewall_port.rc != 0

    - name: API health endpoint 확인
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/health
        return_content: true
        status_code: 200
      register: control_api_health
      changed_when: false
      retries: 10
      delay: 2
      until: control_api_health.status == 200

    - name: Nginx를 경유한 portal 확인
      ansible.builtin.uri:
        url: "http://{{ control_portal_listen_address }}:{{ control_portal_port }}/"
        status_code: 200
        return_content: true
      register: control_portal_health
      changed_when: false
      retries: 10
      delay: 2
      until: "'PRIVATE CLOUD CONTROL' in control_portal_health.content"
