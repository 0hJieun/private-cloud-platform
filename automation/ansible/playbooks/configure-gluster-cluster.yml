---
- name: GlusterFS replica 2 클러스터 구성
  hosts: storage_nodes
  gather_facts: false
  become: true

  vars:
    gluster_primary_node: "{{ groups['storage_nodes'] | first }}"
    gluster_volume_name: instance-volumes
    gluster_brick_directory: /srv/gluster/brick1/instances
    gluster_allowed_client_network: 172.16.8.*

  tasks:
    - name: replica 2 구성 노드 수 확인
      ansible.builtin.assert:
        that:
          - groups['storage_nodes'] | length == 2
        fail_msg: >-
          이 플레이북은 storage 노드 두 대로 구성한 replica 2 환경용입니다.
          노드 수 변경 시 volume 설계를 먼저 변경하세요.

    # storage1만 제어 지점으로 사용한다. 두 노드에서 동시에 peer probe를 수행하지 않는다.
    - name: storage2를 GlusterFS trusted storage pool에 등록
      ansible.builtin.command: >-
        gluster peer probe
        {{ hostvars[item].provider_address | regex_replace('/.*$', '') }}
      loop: "{{ groups['storage_nodes'] }}"
      when:
        - inventory_hostname == gluster_primary_node
        - item != gluster_primary_node
      register: gluster_peer_probe
      changed_when: "'already in peer list' not in (gluster_peer_probe.stdout | lower)"

    - name: GlusterFS peer 연결 상태 확인
      ansible.builtin.command: gluster peer status
      when: inventory_hostname == gluster_primary_node
      register: gluster_peer_status
      changed_when: false
      retries: 5
      delay: 2
      until: "'Connected' in gluster_peer_status.stdout"

    - name: 기존 GlusterFS 볼륨 존재 여부 확인
      ansible.builtin.command: "gluster volume info {{ gluster_volume_name }}"
      when: inventory_hostname == gluster_primary_node
      register: gluster_volume_info
      changed_when: false
      failed_when: gluster_volume_info.rc not in [0, 1]

    - name: replica 2 인스턴스 볼륨 생성
      ansible.builtin.command: >-
        gluster volume create {{ gluster_volume_name }}
        replica {{ groups['storage_nodes'] | length }}
        transport tcp
        {% for node in groups['storage_nodes'] -%}
        {{ hostvars[node].provider_address | regex_replace('/.*$', '') }}:{{ gluster_brick_directory }}
        {% endfor %}
      when:
        - inventory_hostname == gluster_primary_node
        - gluster_volume_info.rc == 1
      changed_when: true

    - name: 생성된 GlusterFS 볼륨 상태 조회
      ansible.builtin.command: "gluster volume info {{ gluster_volume_name }}"
      when: inventory_hostname == gluster_primary_node
      register: gluster_volume_state
      changed_when: false

    - name: GlusterFS 볼륨 시작
      ansible.builtin.command: "gluster volume start {{ gluster_volume_name }}"
      when:
        - inventory_hostname == gluster_primary_node
        - "'Status: Started' not in gluster_volume_state.stdout"
      changed_when: true

    - name: 현재 GlusterFS 볼륨 접근 허용 대역 조회
      ansible.builtin.command: "gluster volume get {{ gluster_volume_name }} auth.allow"
      when: inventory_hostname == gluster_primary_node
      register: gluster_volume_auth
      changed_when: false

    - name: provider 네트워크의 클라이언트만 볼륨 접근 허용
      ansible.builtin.command: >-
        gluster volume set {{ gluster_volume_name }} auth.allow {{ gluster_allowed_client_network }}
      when:
        - inventory_hostname == gluster_primary_node
        - gluster_allowed_client_network not in gluster_volume_auth.stdout
      changed_when: true

    - name: GlusterFS 볼륨 상태와 brick 상태 확인
      ansible.builtin.command: "gluster volume status {{ gluster_volume_name }}"
      when: inventory_hostname == gluster_primary_node
      changed_when: false
