---
- name: 모든 infrastructure 노드에 Prometheus node exporter 배포
  hosts: monitoring_nodes
  gather_facts: false
  become: true

  vars:
    node_exporter_version: 1.12.1
    node_exporter_archive: "node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    node_exporter_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/{{ node_exporter_archive }}"
    node_exporter_sha256: b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63
    node_exporter_release_directory: "/opt/node_exporter-{{ node_exporter_version }}.linux-amd64"
    node_exporter_service_name: node_exporter

  tasks:
    # Rocky Minimal에는 tar가 없는 경우가 있다. node_exporter와 Prometheus는
    # 모두 .tar.gz release archive로 배포하므로 unarchive 전에 명시적으로 설치한다.
    - name: monitoring release archive 해제 도구 설치
      ansible.builtin.dnf:
        name: tar
        state: present

    - name: firewalld 시작과 자동 시작 설정
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: node exporter system user 생성
      ansible.builtin.user:
        name: node_exporter
        system: true
        shell: /sbin/nologin
        create_home: false

    - name: node exporter release archive 다운로드와 checksum 검증
      ansible.builtin.get_url:
        url: "{{ node_exporter_url }}"
        dest: "/var/tmp/{{ node_exporter_archive }}"
        checksum: "sha256:{{ node_exporter_sha256 }}"
        owner: root
        group: root
        mode: '0644'
        timeout: 60

    - name: node exporter release 압축 해제
      ansible.builtin.unarchive:
        src: "/var/tmp/{{ node_exporter_archive }}"
        dest: /opt
        remote_src: true
        creates: "{{ node_exporter_release_directory }}/node_exporter"

    - name: node exporter 실행 경로 고정
      ansible.builtin.file:
        src: "{{ node_exporter_release_directory }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        state: link
        force: true

    - name: node exporter systemd service 등록
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ node_exporter_service_name }}.service"
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network-online.target
          Wants=network-online.target

          [Service]
          User=node_exporter
          Group=node_exporter
          ExecStart=/usr/local/bin/node_exporter --web.listen-address={{ monitoring_bind_address }}:9100
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=multi-user.target

    - name: node exporter systemd unit 다시 불러오기
      ansible.builtin.systemd:
        daemon_reload: true

    - name: node exporter 시작과 자동 시작 설정
      ansible.builtin.service:
        name: "{{ node_exporter_service_name }}"
        state: restarted
        enabled: true

    - name: firewalld에서 node exporter port 영구 허용 여부 확인
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --query-port=9100/tcp
      register: node_exporter_firewall_port
      changed_when: false
      failed_when: false

    - name: firewalld에서 node exporter management port 허용
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --add-port=9100/tcp
      when: node_exporter_firewall_port.rc != 0

    - name: node exporter port runtime 적용
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --add-port=9100/tcp
      when: node_exporter_firewall_port.rc != 0

    - name: node exporter metrics endpoint 확인
      ansible.builtin.uri:
        url: "http://{{ monitoring_bind_address }}:9100/metrics"
        status_code: 200
        return_content: true
      register: node_exporter_health
      changed_when: false
      retries: 5
      delay: 2
      until: "'node_exporter_build_info' in node_exporter_health.content"

- name: control에 Prometheus와 Grafana dashboard 배포
  hosts: control_nodes
  gather_facts: false
  become: true

  vars:
    control_repository_root: /home/user1/private-cloud-platform
    control_initial_credentials_file: /home/user1/private-cloud-initial-credentials.env
    monitoring_api_environment_file: /etc/private-cloud/api.env
    monitoring_prometheus_version: 3.14.0
    monitoring_prometheus_archive: "prometheus-{{ monitoring_prometheus_version }}.linux-amd64.tar.gz"
    monitoring_prometheus_url: "https://github.com/prometheus/prometheus/releases/download/v{{ monitoring_prometheus_version }}/{{ monitoring_prometheus_archive }}"
    monitoring_prometheus_sha256: f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d
    monitoring_prometheus_release_directory: "/opt/prometheus-{{ monitoring_prometheus_version }}.linux-amd64"
    monitoring_grafana_environment_file: /etc/private-cloud/grafana.env
    monitoring_alertmanager_version: 0.33.1
    monitoring_alertmanager_archive: "alertmanager-{{ monitoring_alertmanager_version }}.linux-amd64.tar.gz"
    monitoring_alertmanager_url: "https://github.com/prometheus/alertmanager/releases/download/v{{ monitoring_alertmanager_version }}/{{ monitoring_alertmanager_archive }}"
    monitoring_alertmanager_checksums_url: "https://github.com/prometheus/alertmanager/releases/download/v{{ monitoring_alertmanager_version }}/sha256sums.txt"
    monitoring_alertmanager_release_directory: "/opt/alertmanager-{{ monitoring_alertmanager_version }}.linux-amd64"
    monitoring_alertmanager_secret_file: /etc/private-cloud/alertmanager.env

  tasks:
    - name: Prometheus system group 생성
      ansible.builtin.group:
        name: prometheus
        system: true

    - name: Prometheus system user 생성
      ansible.builtin.user:
        name: prometheus
        group: prometheus
        system: true
        shell: /sbin/nologin
        create_home: false

    - name: Alertmanager system group 생성
      ansible.builtin.group:
        name: alertmanager
        system: true

    - name: Alertmanager system user 생성
      ansible.builtin.user:
        name: alertmanager
        group: alertmanager
        system: true
        shell: /sbin/nologin
        create_home: false

    - name: Alertmanager 설정과 데이터 경로 생성
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: '0755'
      loop:
        - { path: /etc/alertmanager, owner: root, group: alertmanager }
        - { path: /var/lib/alertmanager, owner: alertmanager, group: alertmanager }
        - { path: /etc/private-cloud, owner: root, group: root }

    # archive와 release manifest는 같은 공식 GitHub release에서 받는다. unarchive 전에
    # manifest의 해당 linux-amd64 checksum으로 archive 무결성을 검증한다.
    - name: Alertmanager release archive 다운로드
      ansible.builtin.get_url:
        url: "{{ monitoring_alertmanager_url }}"
        dest: "/var/tmp/{{ monitoring_alertmanager_archive }}"
        owner: root
        group: root
        mode: '0644'
        timeout: 180

    - name: Alertmanager release checksum manifest 다운로드
      ansible.builtin.get_url:
        url: "{{ monitoring_alertmanager_checksums_url }}"
        dest: "/var/tmp/alertmanager-{{ monitoring_alertmanager_version }}-sha256sums.txt"
        owner: root
        group: root
        mode: '0644'
        timeout: 60

    - name: Alertmanager release archive checksum 검증
      ansible.builtin.shell: |
        set -euo pipefail
        grep -F "  {{ monitoring_alertmanager_archive }}" "/var/tmp/alertmanager-{{ monitoring_alertmanager_version }}-sha256sums.txt" | sha256sum --check --status -
      args:
        chdir: /var/tmp
        executable: /bin/bash
      changed_when: false

    - name: Alertmanager release 압축 해제
      ansible.builtin.unarchive:
        src: "/var/tmp/{{ monitoring_alertmanager_archive }}"
        dest: /opt
        remote_src: true
        creates: "{{ monitoring_alertmanager_release_directory }}/alertmanager"

    - name: Alertmanager 현재 release symlink 설정
      ansible.builtin.file:
        src: "{{ monitoring_alertmanager_release_directory }}"
        dest: /opt/alertmanager
        state: link
        force: true

    - name: Slack webhook secret 파일 초기화
      ansible.builtin.copy:
        dest: "{{ monitoring_alertmanager_secret_file }}"
        owner: root
        group: root
        mode: '0600'
        force: false
        content: |
          # 이 값은 Git에 저장하지 않습니다. Slack Incoming Webhook URL을 로컬에서 입력하세요.
          PRIVATE_CLOUD_SLACK_WEBHOOK_URL=
      no_log: true

    - name: Slack webhook secret 읽기
      ansible.builtin.shell: |
        set -euo pipefail
        set -a
        source "{{ monitoring_alertmanager_secret_file }}"
        set +a
        printf '%s' "${PRIVATE_CLOUD_SLACK_WEBHOOK_URL:-}"
      args:
        executable: /bin/bash
      register: monitoring_slack_webhook_url
      changed_when: false
      no_log: true

    - name: Slack webhook URL 형식 검증
      ansible.builtin.assert:
        that:
          - >-
            monitoring_slack_webhook_url.stdout | trim | length == 0 or
            monitoring_slack_webhook_url.stdout | trim is match('^https://hooks\\.slack\\.com/services/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+$')
        fail_msg: >-
          /etc/private-cloud/alertmanager.env에는 https://hooks.slack.com/services/로 시작하는
          URL만 한 줄로 넣어야 합니다. 따옴표, Markdown backtick, 공백은 넣지 마세요.
      no_log: true

    - name: Alertmanager 알림 라우팅 설정 배포
      ansible.builtin.template:
        src: "{{ control_repository_root }}/monitoring/alertmanager/alertmanager.yml.j2"
        dest: /etc/alertmanager/alertmanager.yml
        owner: root
        group: alertmanager
        mode: '0640'
      no_log: true

    - name: Alertmanager 설정 문법 검증
      ansible.builtin.command:
        argv:
          - /opt/alertmanager/amtool
          - check-config
          - /etc/alertmanager/alertmanager.yml
      changed_when: false

    - name: Alertmanager systemd service 등록
      ansible.builtin.copy:
        dest: /etc/systemd/system/alertmanager.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Prometheus Alertmanager
          After=network-online.target
          Wants=network-online.target

          [Service]
          User=alertmanager
          Group=alertmanager
          ExecStart=/opt/alertmanager/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/var/lib/alertmanager --web.listen-address=127.0.0.1:9093
          Restart=on-failure
          RestartSec=3
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectHome=true
          ProtectSystem=full

          [Install]
          WantedBy=multi-user.target

    - name: Alertmanager systemd unit 다시 불러오기
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Alertmanager 시작과 자동 시작 설정
      ansible.builtin.service:
        name: alertmanager
        state: restarted
        enabled: true

    - name: Alertmanager health endpoint 확인
      ansible.builtin.uri:
        url: http://127.0.0.1:9093/-/healthy
        status_code: 200
      register: alertmanager_health
      changed_when: false
      retries: 10
      delay: 2
      until: alertmanager_health.status == 200

    - name: Prometheus release archive 다운로드와 checksum 검증
      ansible.builtin.get_url:
        url: "{{ monitoring_prometheus_url }}"
        dest: "/var/tmp/{{ monitoring_prometheus_archive }}"
        checksum: "sha256:{{ monitoring_prometheus_sha256 }}"
        owner: root
        group: root
        mode: '0644'
        timeout: 180

    - name: Prometheus release 압축 해제
      ansible.builtin.unarchive:
        src: "/var/tmp/{{ monitoring_prometheus_archive }}"
        dest: /opt
        remote_src: true
        creates: "{{ monitoring_prometheus_release_directory }}/prometheus"

    - name: Prometheus 현재 release symlink 설정
      ansible.builtin.file:
        src: "{{ monitoring_prometheus_release_directory }}"
        dest: /opt/prometheus
        state: link
        force: true

    - name: Prometheus 설정과 TSDB 경로 생성
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: '0755'
      loop:
        - /etc/prometheus
        - /var/lib/prometheus

    - name: Prometheus alert rule 경로 생성
      ansible.builtin.file:
        path: /etc/prometheus/rules
        state: directory
        owner: prometheus
        group: prometheus
        mode: '0755'

    - name: private cloud alert rule 배포
      ansible.builtin.copy:
        src: "{{ control_repository_root }}/monitoring/prometheus/rules/private-cloud-alerts.yml"
        dest: /etc/prometheus/rules/private-cloud-alerts.yml
        owner: prometheus
        group: prometheus
        mode: '0644'

    - name: Prometheus HTTP service discovery token 읽기
      ansible.builtin.shell: |
        set -euo pipefail
        set -a
        source "{{ monitoring_api_environment_file }}"
        set +a
        printf '%s' "$PRIVATE_CLOUD_MONITORING_DISCOVERY_TOKEN"
      args:
        executable: /bin/bash
      register: monitoring_instance_discovery_token
      changed_when: false
      no_log: true

    - name: Prometheus HTTP service discovery token 검증
      ansible.builtin.assert:
        that:
          - monitoring_instance_discovery_token.stdout | length >= 64
        fail_msg: configure-control-api.yml을 먼저 실행해 monitoring discovery token을 생성하세요.
      no_log: true

    - name: Prometheus scrape target 설정 배포
      ansible.builtin.template:
        src: "{{ control_repository_root }}/monitoring/prometheus/prometheus.yml.j2"
        dest: /etc/prometheus/prometheus.yml
        owner: prometheus
        group: prometheus
        # HTTP discovery bearer token이 포함되므로 임의 local user가 읽을 수 없게 한다.
        mode: '0640'
      no_log: true

    - name: Prometheus 설정 문법 검증
      ansible.builtin.command:
        argv:
          - /opt/prometheus/promtool
          - check
          - config
          - /etc/prometheus/prometheus.yml
      changed_when: false

    - name: Prometheus alert rule 문법 검증
      ansible.builtin.command:
        argv:
          - /opt/prometheus/promtool
          - check
          - rules
          - /etc/prometheus/rules/private-cloud-alerts.yml
      changed_when: false

    - name: Prometheus systemd service 등록
      ansible.builtin.copy:
        dest: /etc/systemd/system/prometheus.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Prometheus Monitoring Server
          After=network-online.target alertmanager.service
          Wants=network-online.target alertmanager.service

          [Service]
          User=prometheus
          Group=prometheus
          ExecStart=/opt/prometheus/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/var/lib/prometheus --storage.tsdb.retention.time=7d --web.listen-address=127.0.0.1:9090
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=multi-user.target

    - name: Prometheus systemd unit 다시 불러오기
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Prometheus 시작과 자동 시작 설정
      ansible.builtin.service:
        name: prometheus
        state: restarted
        enabled: true

    - name: Prometheus health endpoint 확인
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/-/healthy
        status_code: 200
      register: prometheus_health
      changed_when: false
      retries: 10
      delay: 2
      until: prometheus_health.status == 200

    - name: Grafana 설치
      ansible.builtin.dnf:
        name: grafana
        state: present

    # Grafana는 SELinux의 grafana_t 도메인으로 실행된다. Prometheus datasource가
    # localhost:9090에도 접속하려면 전용 boolean이 필요하다. Enforcing을 유지한 채
    # 이 연결만 허용한다.
    - name: Grafana의 Prometheus TCP 연결 SELinux 정책 상태 확인
      ansible.builtin.command:
        argv:
          - getsebool
          - grafana_can_tcp_connect_prometheus_port
      register: grafana_prometheus_selinux
      changed_when: false

    - name: Grafana의 Prometheus TCP 연결 SELinux 정책 영구 허용
      ansible.builtin.command:
        argv:
          - setsebool
          - -P
          - grafana_can_tcp_connect_prometheus_port
          - 'on'
      when: "' --> on' not in grafana_prometheus_selinux.stdout"

    - name: Grafana 초기 secret 존재 여부 확인
      ansible.builtin.stat:
        path: "{{ monitoring_grafana_environment_file }}"
      register: grafana_environment

    - name: Grafana admin 초기 password 생성
      ansible.builtin.command:
        argv:
          - openssl
          - rand
          - -hex
          - '16'
      register: grafana_admin_password
      changed_when: true
      no_log: true
      when: not grafana_environment.stat.exists

    - name: Grafana admin secret 파일 생성
      ansible.builtin.copy:
        dest: "{{ monitoring_grafana_environment_file }}"
        owner: root
        group: root
        mode: '0600'
        content: |
          GF_SECURITY_ADMIN_USER=admin
          GF_SECURITY_ADMIN_PASSWORD={{ grafana_admin_password.stdout }}
      no_log: true
      when: not grafana_environment.stat.exists

    - name: API 초기 credential 파일 존재 여부 확인
      ansible.builtin.stat:
        path: "{{ control_initial_credentials_file }}"
      register: control_initial_credentials

    - name: API 초기 credential 파일 검증
      ansible.builtin.assert:
        that:
          - control_initial_credentials.stat.exists
        fail_msg: configure-control-api.yml을 먼저 실행해 초기 credential 파일을 생성하세요.

    - name: user1이 읽을 초기 Grafana credential 추가
      ansible.builtin.blockinfile:
        path: "{{ control_initial_credentials_file }}"
        owner: user1
        group: user1
        mode: '0600'
        marker: "# {mark} PRIVATE CLOUD GRAFANA"
        block: |
          GRAFANA_ADMIN_PASSWORD={{ grafana_admin_password.stdout }}
      no_log: true
      when: not grafana_environment.stat.exists

    - name: Grafana service environment drop-in 생성
      ansible.builtin.file:
        path: /etc/systemd/system/grafana-server.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Grafana service environment drop-in 파일 생성
      ansible.builtin.copy:
        dest: /etc/systemd/system/grafana-server.service.d/private-cloud.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [Service]
          EnvironmentFile={{ monitoring_grafana_environment_file }}

    - name: Grafana가 management IP에서만 listen하도록 설정
      ansible.builtin.lineinfile:
        path: /etc/grafana/grafana.ini
        regexp: "^;?{{ item.key }} ="
        line: "{{ item.key }} = {{ item.value }}"
        insertafter: '^\[server\]$'
      loop:
        - { key: 'http_addr', value: '172.16.2.10' }
        - { key: 'http_port', value: '3000' }

    - name: Grafana public sign up 비활성화
      ansible.builtin.lineinfile:
        path: /etc/grafana/grafana.ini
        regexp: '^;?allow_sign_up ='
        line: 'allow_sign_up = false'
        insertafter: '^\[users\]$'

    - name: Grafana Prometheus datasource provisioning 배포
      ansible.builtin.copy:
        src: "{{ control_repository_root }}/monitoring/grafana/datasources/prometheus.yml"
        dest: /etc/grafana/provisioning/datasources/private-cloud-prometheus.yml
        owner: root
        group: grafana
        mode: '0640'

    - name: Grafana dashboard provider 설정 배포
      ansible.builtin.copy:
        src: "{{ control_repository_root }}/monitoring/grafana/dashboards/dashboards.yml"
        dest: /etc/grafana/provisioning/dashboards/private-cloud.yml
        owner: root
        group: grafana
        mode: '0640'

    - name: Grafana private cloud node dashboard 배포
      ansible.builtin.copy:
        src: "{{ control_repository_root }}/monitoring/grafana/dashboards/private-cloud-nodes.json"
        dest: /etc/grafana/provisioning/dashboards/private-cloud-nodes.json
        owner: root
        group: grafana
        mode: '0640'

    # VM 지표는 Prometheus HTTP discovery가 붙인 cloud_instance_name label로 선택한다.
    # 포털의 소유자별 현재 상태와 달리 이 dashboard는 admin 운영 분석 전용이다.
    - name: Grafana private cloud instance dashboard 배포
      ansible.builtin.copy:
        src: "{{ control_repository_root }}/monitoring/grafana/dashboards/private-cloud-instances.json"
        dest: /etc/grafana/provisioning/dashboards/private-cloud-instances.json
        owner: root
        group: grafana
        mode: '0640'

    - name: Grafana systemd unit 다시 불러오기
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Grafana 시작과 자동 시작 설정
      ansible.builtin.service:
        name: grafana-server
        state: restarted
        enabled: true

    - name: firewalld에서 Grafana port 영구 허용 여부 확인
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --query-port=3000/tcp
      register: grafana_firewall_port
      changed_when: false
      failed_when: false

    - name: firewalld에서 Grafana management port 허용
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --add-port=3000/tcp
      when: grafana_firewall_port.rc != 0

    - name: Grafana port runtime 적용
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --add-port=3000/tcp
      when: grafana_firewall_port.rc != 0

    - name: Grafana health endpoint 확인
      ansible.builtin.uri:
        url: http://172.16.2.10:3000/api/health
        status_code: 200
      register: grafana_health
      changed_when: false
      retries: 20
      delay: 3
      until: grafana_health.status == 200
