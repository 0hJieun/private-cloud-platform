---
- name: compute 노드의 OVS provider 브리지 구성
  hosts: compute_nodes
  gather_facts: false
  become: true

  vars:
    provider_bridge_name: br-provider
    # bootstrap-provider-network.yml가 새 NIC에 생성하는 연결 프로필 이름이다.
    provider_physical_connection_name: "provider-{{ inventory_hostname }}"
    provider_physical_port_name: "ovs-physical-{{ inventory_hostname }}"
    # OVS에서 호스트 IP를 올리려면 bridge 외에 internal interface가 필요하다.
    provider_local_port_name: "ovs-local-{{ provider_bridge_name }}"
    provider_local_interface_profile: "ovs-if-{{ provider_bridge_name }}"
    unused_wired_profile: Wired connection 1

  tasks:
    - name: provider 물리 NIC 연결 프로필 확인
      ansible.builtin.command:
        argv:
          - nmcli
          - connection
          - show
          - "{{ provider_physical_connection_name }}"
      changed_when: false
      check_mode: false

    - name: 현재 NetworkManager 연결 이름 조회
      ansible.builtin.command:
        argv:
          - nmcli
          - --get-values
          - NAME
          - connection
          - show
      register: connection_names
      changed_when: false
      check_mode: false

    - name: OVS provider 브리지 생성
      ansible.builtin.command:
        argv:
          - nmcli
          - connection
          - add
          - type
          - ovs-bridge
          - ifname
          - "{{ provider_bridge_name }}"
          - con-name
          - "{{ provider_bridge_name }}"
      changed_when: true
      when: provider_bridge_name not in connection_names.stdout_lines

    # ovs-bridge는 L2 스위치 역할만 한다. 호스트 IP는 아래 ovs-interface에 둔다.
    - name: OVS provider 브리지의 L3 IP 설정 비활성화
      ansible.builtin.command:
        argv:
          - nmcli
          - connection
          - modify
          - "{{ provider_bridge_name }}"
          - ipv4.method
          - disabled
          - ipv6.method
          - disabled
          - connection.autoconnect
          - 'yes'
          - connection.autoconnect-ports
          - '1'
      changed_when: true

    - name: 물리 provider NIC용 OVS 포트 생성
      ansible.builtin.command:
        argv:
          - nmcli
          - connection
          - add
          - type
          - ovs-port
          - ifname
          - "{{ provider_physical_port_name }}"
          - con-name
          - "{{ provider_physical_port_name }}"
          - controller
          - "{{ provider_bridge_name }}"
      changed_when: true
      when: provider_physical_port_name not in connection_names.stdout_lines

    - name: 호스트용 OVS 내부 포트 생성
      ansible.builtin.command:
        argv:
          - nmcli
          - connection
          - add
          - type
          - ovs-port
          - ifname
          - "{{ provider_bridge_name }}"
          - con-name
          - "{{ provider_local_port_name }}"
          - controller
          - "{{ provider_bridge_name }}"
      changed_when: true
      when: provider_local_port_name not in connection_names.stdout_lines

    - name: 호스트용 OVS 내부 인터페이스 생성
      ansible.builtin.command:
        argv:
          - nmcli
          - connection
          - add
          - type
          - ovs-interface
          - ifname
          - "{{ provider_bridge_name }}"
          - con-name
          - "{{ provider_local_interface_profile }}"
          - controller
          - "{{ provider_local_port_name }}"
      changed_when: true
      when: provider_local_interface_profile not in connection_names.stdout_lines

    # OVS의 호스트 측 internal interface가 br-provider 장치로 나타난다.
    - name: OVS 내부 인터페이스의 외부 주소 설정
      ansible.builtin.command:
        argv:
          - nmcli
          - connection
          - modify
          - "{{ provider_local_interface_profile }}"
          - ipv4.method
          - manual
          - ipv4.addresses
          - "{{ provider_address }}"
          - ipv4.gateway
          - "{{ provider_gateway }}"
          - ipv4.dns
          - "{{ provider_dns }}"
          - ipv4.never-default
          - 'no'
          - ipv6.method
          - disabled
          - connection.autoconnect
          - 'yes'
      changed_when: true

    - name: OVS 포트의 IP 설정 비활성화
      ansible.builtin.command:
        argv:
          - nmcli
          - connection
          - modify
          - "{{ provider_physical_port_name }}"
          - ipv4.method
          - disabled
          - ipv6.method
          - disabled
          - connection.autoconnect
          - 'yes'
      changed_when: true

    # OVS 포트로 전환하기 전에 기존 IPv4 설정을 완전히 비운다.
    - name: 물리 provider NIC의 기존 IP 설정 제거
      ansible.builtin.command:
        argv:
          - nmcli
          - connection
          - modify
          - "{{ provider_physical_connection_name }}"
          - ipv4.method
          - disabled
          - ipv4.addresses
          - ''
          - ipv4.gateway
          - ''
          - ipv4.dns
          - ''
          - ipv6.method
          - disabled
          - ipv4.never-default
          - 'yes'
      changed_when: true

    - name: 물리 provider NIC를 OVS 포트에 연결
      ansible.builtin.command:
        argv:
          - nmcli
          - connection
          - modify
          - "{{ provider_physical_connection_name }}"
          - connection.controller
          - "{{ provider_physical_port_name }}"
          - connection.port-type
          - ovs-port
          - connection.autoconnect
          - 'yes'
      changed_when: true

    # 기본 템플릿이 남긴 미사용 프로필이 ens192를 다시 점유하지 않게 한다.
    - name: 미사용 기본 유선 프로필의 자동 연결 비활성화
      ansible.builtin.command:
        argv:
          - nmcli
          - connection
          - modify
          - "{{ unused_wired_profile }}"
          - connection.autoconnect
          - 'no'
      changed_when: true
      when: unused_wired_profile in connection_names.stdout_lines

    # Ansible은 관리망 ens160을 이용하므로 provider 전환 중에도 연결이 유지된다.
    - name: 기존 물리 provider 연결 비활성화
      ansible.builtin.command:
        argv:
          - nmcli
          - connection
          - down
          - "{{ provider_physical_connection_name }}"
      changed_when: true
      failed_when: false

    - name: 미사용 기본 유선 연결 비활성화
      ansible.builtin.command:
        argv:
          - nmcli
          - connection
          - down
          - "{{ unused_wired_profile }}"
      changed_when: true
      failed_when: false
      when: unused_wired_profile in connection_names.stdout_lines

    - name: OVS provider 브리지 활성화
      ansible.builtin.command:
        argv:
          - nmcli
          - connection
          - up
          - "{{ provider_bridge_name }}"
      changed_when: true

    - name: 호스트용 OVS 내부 포트 활성화
      ansible.builtin.command:
        argv:
          - nmcli
          - connection
          - up
          - "{{ provider_local_port_name }}"
      changed_when: true

    - name: 호스트용 OVS 내부 인터페이스 활성화
      ansible.builtin.command:
        argv:
          - nmcli
          - connection
          - up
          - "{{ provider_local_interface_profile }}"
      changed_when: true

    - name: 물리 provider OVS 포트 활성화
      ansible.builtin.command:
        argv:
          - nmcli
          - connection
          - up
          - "{{ provider_physical_port_name }}"
      changed_when: true

    - name: 물리 provider NIC 활성화
      ansible.builtin.command:
        argv:
          - nmcli
          - connection
          - up
          - "{{ provider_physical_connection_name }}"
      changed_when: true

    - name: OVS provider 브리지 주소 확인
      ansible.builtin.command:
        argv:
          - ip
          - -br
          - addr
          - show
          - "{{ provider_bridge_name }}"
      register: provider_bridge_address
      changed_when: false
      check_mode: false
      retries: 10
      delay: 1
      until: provider_bridge_address.rc == 0

    - name: 기본 경로 확인
      ansible.builtin.command:
        argv:
          - ip
          - route
          - show
          - default
      register: provider_default_route
      changed_when: false
      check_mode: false
      retries: 10
      delay: 1
      until: >-
        ('via ' ~ provider_gateway ~ ' dev ' ~ provider_bridge_name)
        in provider_default_route.stdout

    - name: OVS provider 브리지 인터페이스 확인
      ansible.builtin.command:
        argv:
          - ovs-vsctl
          - list-ifaces
          - "{{ provider_bridge_name }}"
      register: provider_bridge_interfaces
      changed_when: false
      check_mode: false

    - name: provider DNS 확인
      ansible.builtin.command:
        argv:
          - getent
          - ahostsv4
          - mirrors.rockylinux.org
      changed_when: false
      check_mode: false

    - name: OVS provider 브리지 구성 검증
      ansible.builtin.assert:
        that:
          - (provider_address | regex_replace('/.*$', '')) in provider_bridge_address.stdout
          - provider_interface in provider_bridge_interfaces.stdout_lines
        fail_msg: >-
          br-provider 전환 검증에 실패했습니다. 관리망 ens160 연결은 유지되므로
          NetworkManager와 OVS 상태를 점검한 뒤 복구할 수 있습니다.
