---
# cloudctl delete가 호출한다. 강제 종료를 하지 않고 guest OS의 정상 종료를 기다린다.
- name: libvirt/KVM 인스턴스 정상 종료와 삭제
  hosts: compute_nodes
  gather_facts: false
  become: true

  vars:
    instance_volume_root: /var/lib/private-cloud/volumes
    instance_directory: "{{ instance_volume_root }}/instances/{{ instance_name }}"
    instance_seed_directory: "{{ instance_volume_root }}/seeds/{{ instance_name }}"

  pre_tasks:
    - name: 삭제 요청 인스턴스 이름 검증
      ansible.builtin.assert:
        that:
          - instance_name is match('^[a-z][a-z0-9-]{0,62}$')
        fail_msg: instance_name은 소문자·숫자·하이픈으로 시작하는 63자 이하 이름이어야 합니다.

    - name: 공유 GlusterFS 볼륨 마운트 확인
      ansible.builtin.command:
        argv:
          - findmnt
          - -n
          - -o
          - FSTYPE
          - "{{ instance_volume_root }}"
      register: destroy_gluster_mount
      changed_when: false
      failed_when: >-
        destroy_gluster_mount.rc != 0 or
        destroy_gluster_mount.stdout | trim != 'fuse.glusterfs'

    - name: libvirt 도메인 존재 여부 확인
      ansible.builtin.command:
        argv:
          - virsh
          - -c
          - qemu:///system
          - dominfo
          - "{{ instance_name }}"
      changed_when: false

  tasks:
    - name: 현재 인스턴스 실행 상태 확인
      ansible.builtin.command:
        argv:
          - virsh
          - -c
          - qemu:///system
          - domstate
          - "{{ instance_name }}"
      register: destroy_instance_state
      changed_when: false

    - name: 실행 중인 인스턴스에 정상 종료 요청
      ansible.builtin.command:
        argv:
          - virsh
          - -c
          - qemu:///system
          - shutdown
          - "{{ instance_name }}"
      when: destroy_instance_state.stdout | trim == 'running'

    - name: 인스턴스 정상 종료 대기
      ansible.builtin.command:
        argv:
          - virsh
          - -c
          - qemu:///system
          - domstate
          - "{{ instance_name }}"
      register: shutdown_wait
      changed_when: false
      retries: 30
      delay: 2
      until: shutdown_wait.stdout | trim in ['shut off', 'crashed']

    - name: libvirt 도메인 정의 제거
      ansible.builtin.command:
        argv:
          - virsh
          - -c
          - qemu:///system
          - undefine
          - "{{ instance_name }}"
          - --managed-save

    # 이름 검증과 domain 제거가 성공한 뒤에만 해당 인스턴스 디렉터리 두 개를 지운다.
    - name: 공유 인스턴스 overlay 디스크 삭제
      ansible.builtin.file:
        path: "{{ instance_directory }}"
        state: absent

    - name: 공유 cloud-init 시드 디스크 삭제
      ansible.builtin.file:
        path: "{{ instance_seed_directory }}"
        state: absent
