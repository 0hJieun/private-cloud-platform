---
# 첫 인스턴스 검증용 프로비저너다. --limit으로 배치할 compute를 명시한다.
# 이후 control-plane scheduler가 자원 기준으로 compute를 고른 뒤 같은 playbook을 호출한다.
- name: libvirt/KVM 인스턴스 프로비저닝
  hosts: compute_nodes
  gather_facts: false
  become: true

  vars:
    # clouduser는 각 VM의 고정 guest 계정이다. 실제 사람의 식별은 control DB의 user와
    # 등록 SSH 공개키로 처리한다. root·비밀번호 SSH는 cloud-init에서 비활성화한다.
    instance_ssh_user: clouduser
    instance_vcpus: 1
    instance_memory_mb: 1024
    instance_disk_size_gb: 10
    # cloud image는 설치 media가 아닌 기존 disk를 import한다. generic은 Rocky와 Ubuntu
    # 모두에 안전한 libvirt device profile이며 OS 이름을 잘못 가정하지 않는다.
    instance_os_variant: generic
    instance_volume_root: /var/lib/private-cloud/volumes
    # YAML의 folded scalar는 줄 사이에 공백을 넣으므로 파일 경로는 한 줄로 유지한다.
    instance_cloud_image_path: /var/lib/private-cloud/volumes/images/Rocky-9-GenericCloud-Base-9.8-20260525.0.x86_64.qcow2
    instance_directory: "{{ instance_volume_root }}/instances/{{ instance_name }}"
    instance_seed_directory: "{{ instance_volume_root }}/seeds/{{ instance_name }}"
    instance_disk_path: "{{ instance_directory }}/disk.qcow2"
    instance_seed_path: "{{ instance_seed_directory }}/seed.img"
    # worker는 DB에서 꺼낸 소유자 공개키를 control의 안전한 임시 파일에 쓰고 이 경로만
    # extra var로 전달한다. 공개키 문자열을 shell 인자에 직접 넣지 않기 위한 선택이다.
    instance_owner_ssh_public_key_path: ''
    instance_owner_ssh_public_key: ''
    # guest agent는 테넌트가 명시적으로 선택한 경우에만 설치한다. control의 VM 생성·
    # 삭제·DHCP 확인은 libvirt와 DHCP lease를 사용하므로 guest SSH 관리키가 필요 없다.
    instance_monitoring_enabled: false
    instance_monitoring_prometheus_address: 172.16.8.10
    instance_node_exporter_version: 1.12.1
    instance_node_exporter_archive: "node_exporter-{{ instance_node_exporter_version }}.linux-amd64.tar.gz"
    instance_node_exporter_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ instance_node_exporter_version }}/{{ instance_node_exporter_archive }}"
    instance_node_exporter_sha256: b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63

  pre_tasks:
    - name: 인스턴스 요청값 검증
      ansible.builtin.assert:
        that:
          - instance_name is match('^[a-z][a-z0-9-]{0,62}$')
          - instance_vcpus | int >= 1
          - instance_vcpus | int <= 2
          - instance_memory_mb | int >= 512
          - instance_memory_mb | int <= 2048
          - instance_disk_size_gb | int >= 10
          # worker는 공개키를 shell 인자가 아닌 안전한 임시 파일 경로로 전달한다.
          # 실제 key format은 그 파일을 읽은 뒤 아래 별도 task에서 검증한다.
          - >-
            instance_owner_ssh_public_key_path | length > 0 or
            instance_owner_ssh_public_key is match('^ssh-(ed25519|rsa|ecdsa) ')
        fail_msg: >-
          instance_name(소문자, 숫자, 하이픈), vCPU(1~2), 메모리(512~2048MB),
          디스크(10GB 이상), 소유자 SSH 공개키를 확인하세요.

    - name: 소유자 SSH 공개키 파일 존재 여부 확인
      ansible.builtin.stat:
        path: "{{ instance_owner_ssh_public_key_path }}"
      delegate_to: localhost
      become: false
      register: instance_owner_key_file
      when: instance_owner_ssh_public_key_path | length > 0

    - name: 소유자 SSH 공개키 파일 검증
      ansible.builtin.assert:
        that:
          - instance_owner_key_file.stat.exists
          - instance_owner_key_file.stat.isreg
        fail_msg: 인스턴스 소유자 SSH 공개키 파일을 찾지 못했습니다.
      when: instance_owner_ssh_public_key_path | length > 0

    - name: 파일에서 소유자 SSH 공개키 읽기
      ansible.builtin.set_fact:
        instance_owner_ssh_public_key: "{{ lookup('ansible.builtin.file', instance_owner_ssh_public_key_path) | trim }}"
      when: instance_owner_ssh_public_key_path | length > 0

    - name: 소유자 SSH 공개키 형식 검증
      ansible.builtin.assert:
        that:
          - instance_owner_ssh_public_key is match('^ssh-(ed25519|rsa|ecdsa) ')
        fail_msg: 인스턴스 소유자 SSH 공개키 형식이 올바르지 않습니다.

    - name: 공유 GlusterFS 볼륨 마운트 확인
      ansible.builtin.command:
        argv:
          - findmnt
          - -n
          - -o
          - FSTYPE
          - "{{ instance_volume_root }}"
      register: instance_gluster_mount
      changed_when: false
      failed_when: >-
        instance_gluster_mount.rc != 0 or
        instance_gluster_mount.stdout | trim != 'fuse.glusterfs'

    - name: QEMU의 FUSE 접근 SELinux 정책 확인
      ansible.builtin.command:
        argv:
          - getsebool
          - virt_use_fusefs
      register: virt_use_fusefs_state
      changed_when: false
      failed_when: "'on' not in virt_use_fusefs_state.stdout"

    - name: GenericCloud 베이스 이미지 확인
      ansible.builtin.stat:
        path: "{{ instance_cloud_image_path }}"
      register: cloud_image_file

    - name: 베이스 이미지 존재 여부 검증
      ansible.builtin.assert:
        that:
          - cloud_image_file.stat.exists
          - cloud_image_file.stat.isreg
        fail_msg: 공유 GlusterFS 이미지 라이브러리에 Rocky GenericCloud qcow2 이미지가 없습니다.

  tasks:
    - name: 인스턴스 디스크와 cloud-init 시드 경로 생성
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - "{{ instance_directory }}"
        - "{{ instance_seed_directory }}"

    # base 이미지 자체는 수정하지 않는다. qcow2 overlay에는 인스턴스별 변경분만 기록된다.
    - name: GenericCloud 베이스 이미지에서 인스턴스 overlay 디스크 생성
      ansible.builtin.command:
        argv:
          - qemu-img
          - create
          - -f
          - qcow2
          - -F
          - qcow2
          - -b
          - "{{ instance_cloud_image_path }}"
          - "{{ instance_disk_path }}"
          - "{{ instance_disk_size_gb }}G"
        creates: "{{ instance_disk_path }}"

    - name: QEMU가 인스턴스 overlay 디스크를 쓸 수 있도록 권한 설정
      ansible.builtin.file:
        path: "{{ instance_disk_path }}"
        owner: qemu
        group: qemu
        mode: '0660'

    - name: cloud-init user-data 작성
      ansible.builtin.copy:
        dest: "{{ instance_seed_directory }}/user-data"
        owner: root
        group: root
        mode: '0644'
        content: |
          #cloud-config
          hostname: {{ instance_name }}
          manage_etc_hosts: true
          {% if instance_monitoring_enabled | bool %}
          # managed monitoring VM은 공통 cloud-init package module로 Rocky/Ubuntu에
          # 필요한 도구와 firewalld를 설치한다. exporter는 firewall rule을 만든 뒤 시작한다.
          package_update: true
          packages:
            - curl
            - tar
            - firewalld
          {% endif %}
          users:
            - name: {{ instance_ssh_user }}
              groups: wheel
              shell: /bin/bash
              sudo: ALL=(ALL) NOPASSWD:ALL
              ssh_authorized_keys:
                # VM 소유자가 등록한 공개키만 주입한다. control의 Ansible private key는
                # infrastructure node 자동화 전용이며 tenant guest에는 넣지 않는다.
                - {{ instance_owner_ssh_public_key }}
          ssh_pwauth: false
          disable_root: true
          runcmd:
          {% if instance_monitoring_enabled | bool %}
            # exporter는 control Prometheus(172.16.8.10)만 scrape할 수 있게 먼저
            # firewall을 구성한다. public provider network 전체에 9100/tcp를 열지 않는다.
            - systemctl enable --now firewalld
            - firewall-cmd --permanent --add-service=ssh
            - firewall-cmd --permanent --add-rich-rule='rule family="ipv4" source address="{{ instance_monitoring_prometheus_address }}" port port="9100" protocol="tcp" accept'
            - firewall-cmd --reload
            - |
              set -euo pipefail
              useradd --system --no-create-home --shell /sbin/nologin node_exporter || true
              archive=/var/tmp/{{ instance_node_exporter_archive }}
              curl --fail --location --retry 3 --silent --show-error "{{ instance_node_exporter_url }}" --output "$archive"
              echo "{{ instance_node_exporter_sha256 }}  $archive" | sha256sum --check --status
              tar --extract --gzip --file "$archive" --directory /opt
              install --owner=root --group=root --mode=0755 "/opt/node_exporter-{{ instance_node_exporter_version }}.linux-amd64/node_exporter" /usr/local/bin/node_exporter
              systemctl daemon-reload
              systemctl enable --now node_exporter
          {% else %}
            # provider 네트워크에서도 SSH 서비스만 허용한다. 실패해도 이미지 기본 부팅을
            # 막지 않도록 firewalld가 없는 이미지에서는 그대로 넘어간다.
            - systemctl enable --now firewalld || true
            - firewall-cmd --permanent --add-service=ssh || true
            - firewall-cmd --reload || true
          {% endif %}
          {% if instance_monitoring_enabled | bool %}
          write_files:
            - path: /etc/systemd/system/node_exporter.service
              permissions: '0644'
              content: |
                [Unit]
                Description=Prometheus Node Exporter (managed instance)
                After=network-online.target
                Wants=network-online.target

                [Service]
                User=node_exporter
                Group=node_exporter
                ExecStart=/usr/local/bin/node_exporter --web.listen-address=:9100
                Restart=on-failure
                RestartSec=3
                NoNewPrivileges=true
                PrivateTmp=true
                ProtectHome=true
                ProtectSystem=full

                [Install]
                WantedBy=multi-user.target
          {% endif %}

    - name: cloud-init meta-data 작성
      ansible.builtin.copy:
        dest: "{{ instance_seed_directory }}/meta-data"
        owner: root
        group: root
        mode: '0644'
        content: |
          instance-id: {{ instance_name }}
          local-hostname: {{ instance_name }}

    # NoCloud datasource는 CIDATA 라벨의 VFAT 디스크에서 user-data와 meta-data를 읽는다.
    # 이미 존재하는 시드는 바꾸지 않아 재실행이 기존 VM의 최초 부팅 설정을 덮어쓰지 않는다.
    - name: cloud-init NoCloud 시드 디스크 생성
      ansible.builtin.shell: |
        set -euo pipefail
        mount_directory="$(mktemp -d)"
        cleanup() {
          mountpoint -q "$mount_directory" && umount "$mount_directory" || true
          rmdir "$mount_directory" || true
        }
        trap cleanup EXIT
        truncate -s 8M "{{ instance_seed_path }}"
        mkfs.vfat -F 32 -n CIDATA "{{ instance_seed_path }}"
        mount -o loop "{{ instance_seed_path }}" "$mount_directory"
        install -m 0644 "{{ instance_seed_directory }}/user-data" "$mount_directory/user-data"
        install -m 0644 "{{ instance_seed_directory }}/meta-data" "$mount_directory/meta-data"
        sync
      args:
        creates: "{{ instance_seed_path }}"
        executable: /bin/bash

    - name: 기존 libvirt 도메인 존재 여부 확인
      ansible.builtin.command:
        argv:
          - virsh
          - -c
          - qemu:///system
          - dominfo
          - "{{ instance_name }}"
      register: instance_domain
      changed_when: false
      failed_when: false

    # br-provider는 OVS bridge다. inner VM도 같은 provider L2 네트워크에서 DHCP 주소를 받는다.
    - name: libvirt 인스턴스 정의와 부팅
      ansible.builtin.command:
        argv:
          - virt-install
          - --connect
          - qemu:///system
          - --name
          - "{{ instance_name }}"
          - --memory
          - "{{ instance_memory_mb }}"
          - --vcpus
          - "{{ instance_vcpus }}"
          - --os-variant
          - "{{ instance_os_variant }}"
          - --import
          - --disk
          - "path={{ instance_disk_path }},format=qcow2,bus=virtio"
          - --disk
          - "path={{ instance_seed_path }},format=raw,bus=virtio,readonly=on"
          - --network
          - bridge=br-provider,model=virtio,virtualport_type=openvswitch
          - --graphics
          - none
          - --noautoconsole
          - --autostart
      when: instance_domain.rc != 0

    - name: 인스턴스 부팅 상태 확인
      ansible.builtin.command:
        argv:
          - virsh
          - -c
          - qemu:///system
          - domstate
          - "{{ instance_name }}"
      register: instance_state
      changed_when: false
      retries: 15
      delay: 2
      until: instance_state.stdout | trim == 'running'

    - name: 생성된 인스턴스 네트워크 인터페이스 확인
      ansible.builtin.command:
        argv:
          - virsh
          - -c
          - qemu:///system
          - domiflist
          - "{{ instance_name }}"
      register: instance_interfaces
      changed_when: false

    - name: 인스턴스 생성 결과 출력
      ansible.builtin.debug:
        msg:
          - "{{ instance_name }}이(가) {{ inventory_hostname }}에서 실행 중입니다."
          - "디스크: {{ instance_disk_path }}"
          - "네트워크: br-provider (control DHCP 풀 172.16.8.151~239)"
          - "{{ instance_interfaces.stdout }}"
