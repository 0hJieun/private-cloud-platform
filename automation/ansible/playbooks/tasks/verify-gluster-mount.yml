---
# 호출하는 playbook이 gluster_check_mountpoint로 공유 볼륨 경로를 전달한다.
# 마운트 목록만 읽는 findmnt는 대기 중인 automount를 시작하지 않는다.
- name: 공유 경로 접근으로 Gluster 자동 마운트 요청
  ansible.builtin.command:
    argv:
      - timeout
      - --kill-after=5s
      - 45s
      - stat
      - --format=%F
      - "{{ gluster_check_mountpoint }}/."
  changed_when: false
  check_mode: false

# autofs와 FUSE가 같은 경로에 겹쳐 보일 수 있으므로 실제 Gluster만 검사한다.
# 로컬 디렉터리나 autofs만 있는 상태를 성공으로 처리하지 않는다.
- name: 실제 GlusterFS 파일시스템 연결 검증
  ansible.builtin.command:
    argv:
      - findmnt
      - --noheadings
      - --raw
      - --types
      - fuse.glusterfs
      - --mountpoint
      - "{{ gluster_check_mountpoint }}"
      - --output
      - FSTYPE
  register: verified_gluster_mount
  changed_when: false
  check_mode: false
  failed_when: >-
    verified_gluster_mount.rc != 0 or
    verified_gluster_mount.stdout | trim != 'fuse.glusterfs'
