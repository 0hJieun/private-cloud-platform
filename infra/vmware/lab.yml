# VMware 외부 VM 실험 환경 설계도
#
# 이 파일에는 VM 설정값만 기록한다.
# ISO, VMDK, QCOW2 같은 실제 이미지 파일은 저장소에 커밋하지 않는다.

version: 1

images:
  outer_vm: Rocky Linux 9 Minimal ISO
  inner_instance: Rocky Linux 9 GenericCloud qcow2

networks:
  management:
    vmnet: VMnet2
    cidr: 172.16.2.0/24
    dhcp: disabled
    purpose: control, compute, storage 관리용 네트워크

  provider:
    vmnet: VMnet8
    cidr: 172.16.8.0/24
    gateway: 172.16.8.2
    dhcp_range: 172.16.8.151-172.16.8.239
    dhcp_server: control
    purpose: 인스턴스 네트워크와 외부 인터넷 연결

nodes:
  control:
    hostname: control
    role: control-plane
    vcpus: 2
    memory_mb: 4096
    disks:
      - name: os
        size_gb: 20
        provisioning: thin
    nics:
      - network: management
        address: 172.16.2.10/24
      - network: provider
        address: 172.16.8.10/24
        default_gateway: 172.16.8.2

  compute1:
    hostname: compute1
    role: compute
    nested_virtualization: true
    vcpus: 3
    memory_mb: 6144
    disks:
      - name: os
        size_gb: 20
        provisioning: thin
    nics:
      - network: management
        address: 172.16.2.11/24
      - network: provider
        # ens192 자체가 아니라 이후 br-provider OVS 브리지가 이 주소를 사용한다.
        address: 172.16.8.11/24
        default_gateway: 172.16.8.2
        dns:
          - 8.8.8.8
          - 1.1.1.1
        bridge: br-provider

  compute2:
    hostname: compute2
    role: compute
    nested_virtualization: true
    vcpus: 3
    memory_mb: 6144
    disks:
      - name: os
        size_gb: 20
        provisioning: thin
    nics:
      - network: management
        address: 172.16.2.12/24
      - network: provider
        # ens192 자체가 아니라 이후 br-provider OVS 브리지가 이 주소를 사용한다.
        address: 172.16.8.12/24
        default_gateway: 172.16.8.2
        dns:
          - 8.8.8.8
          - 1.1.1.1
        bridge: br-provider

  # storage1·2의 데이터 디스크로 replica 2 GlusterFS 볼륨을 구성한다.
  storage1:
    hostname: storage1
    role: shared-storage
    vcpus: 1
    memory_mb: 2048
    disks:
      - name: os
        # Packer base 이미지를 full clone하므로 실제 OS 디스크 크기도 20GB다.
        size_gb: 20
        provisioning: thin
      - name: gluster-data
        size_gb: 10
        provisioning: thin
    nics:
      - network: management
        address: 172.16.2.21/24
      - network: provider
        address: 172.16.8.21/24
        default_gateway: 172.16.8.2
        dns:
          - 8.8.8.8
          - 1.1.1.1

  storage2:
    hostname: storage2
    role: shared-storage
    vcpus: 1
    memory_mb: 2048
    disks:
      - name: os
        # Packer base 이미지를 full clone하므로 실제 OS 디스크 크기도 20GB다.
        size_gb: 20
        provisioning: thin
      - name: gluster-data
        size_gb: 10
        provisioning: thin
    nics:
      - network: management
        address: 172.16.2.22/24
      - network: provider
        address: 172.16.8.22/24
        default_gateway: 172.16.8.2
        dns:
          - 8.8.8.8
          - 1.1.1.1
