groups:
  - name: private-cloud.infrastructure
    rules:
      # compute 장애는 해당 호스트의 VM에도 영향을 줄 수 있어 critical로 분류한다.
      # 순간적인 연결 실패를 제외하려고 30초 지속 뒤 알린다.
      - alert: ComputeNodeDown
        expr: up{job="node",role="compute"} == 0
        for: 30s
        labels:
          severity: critical
          scope: infrastructure
        annotations:
          summary: "컴퓨트 {{ $labels.node }}의 지표 수집 연결 이상"
          description: "Prometheus가 {{ $labels.node }}의 node exporter를 30초 이상 수집하지 못했습니다. 해당 호스트와 VM 상태를 확인하세요."

      # 수집 실패만으로 데이터 복제 상태를 단정하지 않는다.
      # warning으로 알리고 노드 연결·복제본·복구 후 동기화를 확인하도록 안내한다.
      - alert: StorageNodeDown
        expr: up{job="node",role="storage"} == 0
        for: 30s
        labels:
          severity: warning
          scope: storage
        annotations:
          summary: "스토리지 {{ $labels.node }}의 지표 수집 연결 이상"
          description: "노드 연결과 GlusterFS 복제본 상태를 점검하세요. 노드 복구 뒤 gluster volume heal 명령으로 동기화 상태를 확인하세요."

      - alert: ManagedInstanceExporterDown
        expr: up{job="instance"} == 0
        for: 30s
        labels:
          severity: warning
          scope: guest
        annotations:
          summary: "VM {{ $labels.cloud_instance_name }}의 지표 수집 연결 이상"
          description: "VM 전원, 네트워크, 방화벽 또는 node_exporter 서비스를 확인하세요. 이 경보만으로 VM 전원 상태를 단정할 수는 없습니다."

      - alert: GlusterBrickCapacityHigh
        expr: >-
          100 * (1 - node_filesystem_avail_bytes{job="node",role="storage",mountpoint="/srv/gluster/brick1"}
          / node_filesystem_size_bytes{job="node",role="storage",mountpoint="/srv/gluster/brick1"}) > 85
        for: 10m
        labels:
          severity: warning
          scope: storage
        annotations:
          summary: "스토리지 {{ $labels.node }}의 데이터 디스크 사용률 85% 초과"
          description: "GlusterFS 데이터 파일시스템 사용률이 10분 이상 85%를 초과했습니다. 원본 이미지와 VM 변경분 디스크 용량을 점검하세요."
