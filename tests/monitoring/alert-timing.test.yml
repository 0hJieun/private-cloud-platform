rule_files:
  - ../../monitoring/prometheus/rules/private-cloud-alerts.yml
evaluation_interval: 10s
tests:
  - name: 연속 수집 실패가 30초 지속되면 알리고 복구 시 해제
    interval: 10s
    input_series:
      - series: 'up{job="node",role="compute",node="compute2"}'
        values: '1 0 0 0 0 0 1 1'
      - series: 'up{job="node",role="storage",node="storage2"}'
        values: '1 0 0 0 0 0 1 1'
      - series: 'up{job="instance",cloud_instance_name="vm01"}'
        values: '1 0 0 0 0 0 1 1'
    promql_expr_test:
      - expr: 'count(ALERTS{alertstate="firing"})'
        eval_time: 30s
        exp_samples: []
      - expr: 'count(ALERTS{alertstate="firing"})'
        eval_time: 40s
        exp_samples:
          - labels: '{}'
            value: 3
      - expr: 'count(ALERTS{alertstate="firing"})'
        eval_time: 60s
        exp_samples: []
  - name: 지속 조건 이전에 복구된 일시적 실패는 알리지 않음
    interval: 10s
    input_series:
      - series: 'up{job="node",role="compute",node="compute2"}'
        values: '1 0 0 1 1 1'
      - series: 'up{job="node",role="storage",node="storage2"}'
        values: '1 0 0 1 1 1'
      - series: 'up{job="instance",cloud_instance_name="vm01"}'
        values: '1 0 0 1 1 1'
    promql_expr_test:
      - expr: 'count(ALERTS{alertstate="firing"})'
        eval_time: 40s
        exp_samples: []
